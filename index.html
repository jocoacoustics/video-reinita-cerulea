<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reinita cerúlea</title>
  <style>
    html, body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; }
    video { display:block; width:100vw; height:100dvh; object-fit:contain; background:#000; }
    #play { position:fixed; inset:0; margin:auto; width:88px; height:88px; border:0; border-radius:50%; background:#0009; color:#fff; font-size:40px; cursor:pointer; }
    #play[hidden] { display:none; }
  </style>
</head>
<body>
  <video id="video" src="reinita_cerulea.mp4" controls playsinline preload="auto"></video>
  <button id="play" aria-label="Reproducir video" hidden>▶</button>
  <script>
    const video = document.getElementById('video');
    const button = document.getElementById('play');
    button.addEventListener('click', async () => {
      try { await video.play(); button.hidden = true; } catch { button.hidden = false; }
    });
    video.addEventListener('play', () => { button.hidden = true; });
    video.addEventListener('ended', () => { button.hidden = true; });
    video.play().catch(() => { button.hidden = false; });
  </script>
</body>
</html>
